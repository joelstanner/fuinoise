{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fuinoise{% endblock %} · Fuinoise</title>
  <link rel="stylesheet" href="{% static 'fuinoise_live/site.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="{% url 'current_events' %}">Fuinoise<span class="wordmark-dot">.</span></a>
      <nav aria-label="Events">
        <a href="{% url 'current_events' %}">Current</a>
        <a href="{% url 'upcoming_events' %}">Upcoming</a>
        <a href="{% url 'historical_events' %}">History</a>
      </nav>
    </div>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer shell">Live music, connected by raids.</footer>
</body>
</html>
